# Traefik values
# Behind Cloudflare Tunnel, so:
#   - service is ClusterIP only (no public LB)
#   - HTTP only on the entrypoint (no TLS at this layer)
#   - container binds to UNPRIVILEGED 8000; service exposes 80 (cluster default)
#   - trust X-Forwarded-* headers from cloudflared (in-cluster, IPs from VPC/pod CIDRs)

deployment:
  replicas: 2
  kind: Deployment

# ClusterIP only. cloudflared connects via cluster DNS.
service:
  type: ClusterIP

# Single HTTP entrypoint.
# port: 80     -> what the Service exposes (what cloudflared connects to)
# exposedPort  -> not used since this is ClusterIP, but kept for clarity
# containerPort: 8000  -> what Traefik actually binds to inside the pod (unprivileged)
ports:
  web:
    port: 80
    containerPort: 8000
    protocol: TCP
    expose:
      default: true
    forwardedHeaders:
      trustedIPs:
        - 10.244.0.0/16  # DOKS pod CIDR
        - 10.245.0.0/16  # DOKS service CIDR
        - 10.20.0.0/16   # VPC
    proxyProtocol:
      trustedIPs:
        - 10.244.0.0/16
        - 10.20.0.0/16
  websecure:
    expose:
      default: false
  metrics:
    expose:
      default: false
  traefik:
    expose:
      default: false

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: false

ingressRoute:
  dashboard:
    enabled: false

logs:
  general:
    format: json
    level: INFO
  access:
    enabled: true
    format: json

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1
