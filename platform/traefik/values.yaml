# Traefik values
# Behind Cloudflare Tunnel, so:
#   - Service is ClusterIP only (no public LB)
#   - HTTP only (no TLS at this layer; CF terminates at edge)
#   - Container binds UNPRIVILEGED 8000; Service maps :80 -> :8000
#   - cloudflared connects to traefik.traefik-system.svc.cluster.local:80
#   - trust X-Forwarded-* headers from cloudflared

deployment:
  replicas: 2
  kind: Deployment

service:
  type: ClusterIP

# Pod-level (no capabilities here; that's a container-level concept)
podSecurityContext:
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

# Container-level
containerSecurityContext:
  capabilities:
    drop: [ALL]
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

# Port mapping:
#   port: 80              -> Service port (cloudflared connects here)
#   exposedPort: 80       -> what the chart exposes on the Service
#   targetPort: 8000      -> Service forwards to this on the pod (matches containerPort)
#   containerPort: 8000   -> what Traefik actually binds inside the pod (unprivileged)
#
# Note: containerPort sets traefik's --entryPoints.web.address; targetPort
# routes Service traffic into the container. Both must match.
ports:
  web:
    port: 80
    exposedPort: 80
    targetPort: 8000
    containerPort: 8000
    protocol: TCP
    expose:
      default: true
    forwardedHeaders:
      trustedIPs:
        - 10.244.0.0/16  # DOKS pod CIDR
        - 10.245.0.0/16  # DOKS service CIDR
        - 10.20.0.0/16   # VPC
    proxyProtocol:
      trustedIPs:
        - 10.244.0.0/16
        - 10.20.0.0/16
  websecure:
    expose:
      default: false
  metrics:
    expose:
      default: false
  traefik:
    expose:
      default: false

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: false

ingressRoute:
  dashboard:
    enabled: false

logs:
  general:
    format: json
    level: INFO
  access:
    enabled: true
    format: json

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1
