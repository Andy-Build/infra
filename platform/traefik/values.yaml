# Traefik values
# Behind Cloudflare Tunnel, so:
#   - Service is ClusterIP only (no public LB)
#   - HTTP only (no TLS at this layer; CF terminates at edge)
#   - Container binds UNPRIVILEGED 8000 (chart default); Service exposes :80
#   - cloudflared connects to traefik.traefik-system.svc.cluster.local:80
#   - trust X-Forwarded-* headers from cloudflared
#
# Chart port semantics (from _podtemplate.tpl):
#   port            = entry point address inside the container (also default containerPort)
#   exposedPort     = port the Service listens on (what callers connect to)
#   containerPort   = override of the container port (optional; defaults to `port`)
#   targetPort      = override of the Service's targetPort (optional)
#
# Default values for `web` are port:8000 / exposedPort:80 - exactly what we
# want. We just don't override `port`. The chart's default just works.

deployment:
  replicas: 2
  kind: Deployment

service:
  type: ClusterIP

# Pod-level
podSecurityContext:
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

# Container-level
containerSecurityContext:
  capabilities:
    drop: [ALL]
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

# Don't override `port` or `exposedPort` - chart defaults are correct:
#   web: port=8000 (container binds here), exposedPort=80 (Service listens here)
# We only customize the bits we actually need to change.
ports:
  web:
    forwardedHeaders:
      trustedIPs:
        - 10.244.0.0/16  # DOKS pod CIDR
        - 10.245.0.0/16  # DOKS service CIDR
        - 10.20.0.0/16   # VPC
    proxyProtocol:
      trustedIPs:
        - 10.244.0.0/16
        - 10.20.0.0/16
  websecure:
    expose:
      default: false
  metrics:
    expose:
      default: false
  traefik:
    expose:
      default: false

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: false

ingressRoute:
  dashboard:
    enabled: false

logs:
  general:
    format: json
    level: INFO
  access:
    enabled: true
    format: json

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1
