# Traefik values
# Behind Cloudflare Tunnel, so:
#   - service is ClusterIP only (no public LB)
#   - HTTP only on the entrypoint (no TLS at this layer)
#   - container runs as non-root with NET_BIND_SERVICE so it can bind :80
#   - trust X-Forwarded-* headers from cloudflared

deployment:
  replicas: 2
  kind: Deployment

# ClusterIP only. cloudflared connects via cluster DNS.
service:
  type: ClusterIP

# securityContext on the pod - allow binding to privileged ports
securityContext:
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]
  readOnlyRootFilesystem: true
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532

# Single HTTP entrypoint on :80
ports:
  web:
    port: 80
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
    forwardedHeaders:
      trustedIPs:
        - 10.244.0.0/16  # DOKS pod CIDR
        - 10.245.0.0/16  # DOKS service CIDR
        - 10.20.0.0/16   # VPC
    proxyProtocol:
      trustedIPs:
        - 10.244.0.0/16
        - 10.20.0.0/16
  websecure:
    expose:
      default: false
  metrics:
    expose:
      default: false
  traefik:
    expose:
      default: false

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: false

ingressRoute:
  dashboard:
    enabled: false

logs:
  general:
    format: json
    level: INFO
  access:
    enabled: true
    format: json

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1
