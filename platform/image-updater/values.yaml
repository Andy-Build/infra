# ArgoCD Image Updater values
#
# Watches DOCR for new image tags matching configured regexes, then commits
# tag bumps directly to the GitOps repo. ArgoCD auto-syncs the new manifest.
#
# Auth:
#   - Pulls from DOCR using doctl integration credentials (already present
#     in the cluster from Phase 1 -- registry.tf wires this up cluster-wide)
#   - Writes to GitHub using a fine-grained PAT stored in the
#     `git-creds` secret (created out-of-band; see install runbook)

config:
  # Log level: info is fine; debug is noisy
  logLevel: info

  # How often to check registries for new tags
  argocd:
    serverAddress: argocd-server.argocd.svc.cluster.local
    insecure: true   # plain HTTP inside cluster
    plaintext: true
    grpcWeb: false

  # Default registry config -- DOCR
  registries:
    - name: DigitalOcean Container Registry
      api_url: https://registry.digitalocean.com
      prefix: registry.digitalocean.com
      ping: yes
      # Use the cluster's DOCR pull credentials, refreshed on a timer
      # by the doctl integration. The secret name follows the DO convention.
      credentials: pullsecret:argocd/digitalocean-registry
      credsexpire: 12h

  # Git committer identity (appears in auto-bump commits)
  gitCommitUser: argocd-image-updater
  gitCommitMail: bot@andy.build
  # Commit message template for tag bumps
  gitCommitTemplate: |
    chore(image): bump {{ .AppName }} to {{ (index .AppChanges 0).NewTag }}

    [skip ci]

# How frequently the controller polls registries
extraArgs:
  - --interval=2m

# Resource sizing
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 256Mi

# Default to non-root, drop caps (matches platform defaults)
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Service account (chart will create it)
serviceAccount:
  create: true
  name: argocd-image-updater

# Metrics: expose port for future Prometheus integration; not scraped yet
metrics:
  enabled: true
  service:
    enabled: false  # disabled until observability stack is in place
