---
# Cluster-wide secret store for our Vault.
# The vault-ca secret was placed by the bootstrap script (02-vault-config.sh).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: "https://vault-internal.andy.build:8200"
      path: "kv"
      version: "v2"
      caProvider:
        type: Secret
        namespace: external-secrets
        name: vault-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-reader"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
